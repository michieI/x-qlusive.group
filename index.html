<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/x-icon" href="/x_favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/x_favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/x_favicon.png?v=2" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="X-QLUSIVE GROUP — Official site." />
    <meta name="application-name" content="X-QLUSIVE GROUP" />
    <meta name="apple-mobile-web-app-title" content="X-QLUSIVE GROUP" />
    <title>X-QLUSIVE GROUP</title>
    <script>document.title = "X-QLUSIVE GROUP";</script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #000; color: #fff; }
      main { position: fixed; inset: 0; isolation: isolate; background: #000; }
      canvas { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; }
      .mark-shell {
        position: absolute;
        z-index: 4;
        left: 32vw;
        top: 50%;
        width: clamp(220px, 25vw, 390px);
        aspect-ratio: 566 / 394;
        transform: translate3d(-50%, -50%, 0);
        color: #fff;
        pointer-events: none;
      }
      .mark-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        fill: currentColor;
        shape-rendering: geometricPrecision;
      }
      .mark-base { filter: drop-shadow(0 0 16px rgba(255, 255, 255, .18)); }
      .mark-echo {
        opacity: 0;
        filter: brightness(1.08);

      }
      .mark-echo--top { clip-path: polygon(0 0, 100% 0, 100% 29%, 0 36%); }
      .mark-echo--middle {
        clip-path: polygon(0 31%, 100% 25%, 100% 67%, 0 72%);
        animation-delay: 22ms;
      }
      .mark-echo--bottom {
        clip-path: polygon(0 69%, 100% 63%, 100% 100%, 0 100%);
        animation-delay: 44ms;
      }
      .mark-shell.is-glitching .mark-echo {
        animation-name: fragmented-echo-sync;
        animation-duration: 420ms;
        animation-timing-function: steps(1, end);
        animation-iteration-count: 1;
      }
      @keyframes fragmented-echo-sync {
        0%, 7%, 34%, 55%, 82%, 100% { opacity: 0; transform: translate3d(0, 0, 0) scale(1); }
        8% { opacity: .7; transform: translate3d(-5.5%, .5%, 0) scale(1.01); }
        20% { opacity: .3; transform: translate3d(4%, -.5%, 0) scale(.995); }
        35% { opacity: 0; }
        56% { opacity: .55; transform: translate3d(4.5%, 0, 0) scale(1.008); }
        70% { opacity: .2; transform: translate3d(-3%, .3%, 0) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark-echo { animation: none; opacity: 0; }
      }
      .manifesto {
        position: absolute;
        z-index: 4;
        right: 7.5vw;
        top: 50%;
        width: min(36vw, 620px);
        margin: 0;
        transform: translateY(-50%);
        color: #f2f2f2;
        font: 400 clamp(2rem, 4vw, 4.75rem) / .98 Arial, Helvetica, sans-serif;
        letter-spacing: -.04em;
        text-wrap: balance;
        pointer-events: none;
      }
      .separator {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 50%;
        width: 1px;
        height: clamp(190px, 18vw, 260px);
        transform: translate3d(-50%, -50%, 0);
        background: rgba(242, 242, 242, .62);
        box-shadow: 0 0 12px rgba(255, 255, 255, .08);
        pointer-events: none;
      }
      @media (max-width: 700px) {
        .mark-shell {
          left: 8vw;
          top: 11svh;
          width: clamp(140px, 38vw, 210px);
          transform: none;
        }
        .manifesto {
          left: 8vw;
          right: 7vw;
          top: 36svh;
          width: auto;
          transform: none;
          font-size: clamp(1.9rem, 8.25vw, 3.4rem);
          line-height: 1.02;
          letter-spacing: -.035em;
        }
        .separator {
          left: 8vw;
          top: 28svh;
          width: 4rem;
          height: 1px;
          transform: none;
        }
      }
      footer { position: absolute; z-index: 2; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; width: 100%; transform: translateX(-50%); padding: 0 20px; color: #fff; font: 500 10px/1.5 Arial, Helvetica, sans-serif; letter-spacing: .18em; text-align: center; user-select: none; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="visual" aria-hidden="true"></canvas>
      <div class="mark-shell" role="img" aria-label="X-QLUSIVE">
        <svg class="mark-layer mark-base" viewBox="0 0 566 394" aria-hidden="true"><g><path d="M0 0h145l215 197-215 197H0l212-196L0 0Z" /><path d="M418 0h148L397 158l-76-68L418 0Z" /><path d="M394 235l172 159H418l-98-91 74-68Z" /></g></svg>
        <svg class="mark-layer mark-echo mark-echo--top" viewBox="0 0 566 394" aria-hidden="true"><g><path d="M0 0h145l215 197-215 197H0l212-196L0 0Z" /><path d="M418 0h148L397 158l-76-68L418 0Z" /><path d="M394 235l172 159H418l-98-91 74-68Z" /></g></svg>
        <svg class="mark-layer mark-echo mark-echo--middle" viewBox="0 0 566 394" aria-hidden="true"><g><path d="M0 0h145l215 197-215 197H0l212-196L0 0Z" /><path d="M418 0h148L397 158l-76-68L418 0Z" /><path d="M394 235l172 159H418l-98-91 74-68Z" /></g></svg>
        <svg class="mark-layer mark-echo mark-echo--bottom" viewBox="0 0 566 394" aria-hidden="true"><g><path d="M0 0h145l215 197-215 197H0l212-196L0 0Z" /><path d="M418 0h148L397 158l-76-68L418 0Z" /><path d="M394 235l172 159H418l-98-91 74-68Z" /></g></svg>
      </div>
      <span class="separator" aria-hidden="true"></span>
      <p class="manifesto">Creating the Global Platform for Arts, Entertainment and Nightlife.</p>
      <footer>©2026 X-QLUSIVE GROUP. All Rights Reserved.</footer>
    </main>
    <script>
      (() => {
        const canvas = document.getElementById('visual');
        const markShell = document.querySelector('.mark-shell');
        const ctx = canvas.getContext('2d', { alpha: false });
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const streaks = [];
        let width = 0;
        let height = 0;
        let frameId = 0;
        let previousTime = performance.now();
        let elapsed = 0;
        let nextCluster = 180;
        let quietUntil = 0;
        let logoGlitchTimer = 0;

        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          width = innerWidth;
          height = innerHeight;
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (reduceMotion.matches) drawStill();
        }

        function triggerLogoGlitch() {
          if (reduceMotion.matches || !markShell) return;
          clearTimeout(logoGlitchTimer);
          markShell.classList.remove('is-glitching');
          void markShell.offsetWidth;
          markShell.classList.add('is-glitching');
          logoGlitchTimer = setTimeout(() => markShell.classList.remove('is-glitching'), 520);
        }

        function spawnCluster() {
          triggerLogoGlitch();
          const fromLeft = Math.random() < .52;
          const edgeBiased = Math.random() < .72;
          const y = Math.random() * height;
          const count = 1 + Math.floor(Math.random() * 5);
          const baseWidth = width * (.16 + Math.random() * .34);

          for (let i = 0; i < count; i++) {
            const lineWidth = baseWidth * (.48 + Math.random() * .72);
            const x = edgeBiased
              ? (fromLeft ? -lineWidth * (.08 + Math.random() * .42) : width - lineWidth * (.92 - Math.random() * .42))
              : Math.random() * Math.max(1, width - lineWidth);

            streaks.push({
              x,
              y: y + (i - count / 2) * (1.2 + Math.random() * 2.8),
              width: lineWidth,
              height: Math.random() < .78 ? 1 : 1.5 + Math.random() * 1.5,
              age: 0,
              duration: 170 + Math.random() * 520,
              drift: (fromLeft ? 1 : -1) * (18 + Math.random() * 75),
              phase: Math.random() * Math.PI * 2,
              segments: Array.from({ length: 5 + Math.floor(Math.random() * 8) }, () => .28 + Math.random() * .72),
            });
          }

          if (Math.random() < .18) quietUntil = elapsed + 900 + Math.random() * 1700;
        }

        function drawStreak(line, delta) {
          line.age += delta;
          const progress = line.age / line.duration;
          if (progress >= 1) return false;

          const envelope = Math.sin(progress * Math.PI);
          const flicker = .64 + Math.sin(elapsed * .045 + line.phase) * .22 + Math.random() * .14;
          const opacity = Math.max(0, Math.min(1, envelope * flicker));
          const x = line.x + line.drift * line.age / 1000;
          const jitterX = Math.round((Math.random() - .5) * 5);
          const jitterY = Math.random() < .12 ? Math.round((Math.random() - .5) * 2) : 0;

          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.globalAlpha = opacity * .11;
          ctx.fillRect(x + jitterX - 8, line.y + jitterY - 2, line.width + 16, line.height + 4);

          let cursor = 0;
          const gap = Math.max(1, line.width * .006);
          line.segments.forEach((factor, index) => {
            const segmentWidth = line.width / line.segments.length * factor;
            ctx.globalAlpha = opacity * (.36 + Math.random() * .38);
            ctx.fillRect(x + jitterX + cursor, line.y + jitterY, segmentWidth, line.height);
            if (opacity > .82 && index % 3 === 0) {
              ctx.globalAlpha = 1;
              ctx.fillRect(x + jitterX + cursor + segmentWidth * .24, line.y + jitterY, Math.max(2, segmentWidth * .22), Math.min(1, line.height));
            }
            cursor += segmentWidth + gap * (.5 + Math.random() * 2.5);
          });

          if (line.height > 1 && opacity > .3) {
            ctx.globalAlpha = opacity * .42;
            ctx.fillRect(x + jitterX + line.width * .08, line.y - 2, line.width * .72, .5);
            ctx.fillRect(x + jitterX + line.width * .2, line.y + line.height + 2, line.width * .55, .5);
          }

          ctx.restore();
          return true;
        }

        function drawTexture() {
          ctx.save();
          ctx.fillStyle = '#fff';
          const specks = Math.max(8, Math.floor(width * height / 90000));
          for (let i = 0; i < specks; i++) {
            ctx.globalAlpha = Math.random() * .025;
            ctx.fillRect(Math.random() * width, Math.random() * height, 1, 1);
          }
          ctx.restore();
        }

        function render(delta) {
          elapsed += delta;
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
          drawTexture();

          if (elapsed >= nextCluster && elapsed >= quietUntil) {
            spawnCluster();
            nextCluster = elapsed + 260 + Math.random() * 940;
          }

          for (let i = streaks.length - 1; i >= 0; i--) {
            if (!drawStreak(streaks[i], delta)) streaks.splice(i, 1);
          }
        }

        function drawStill() {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
          drawTexture();
        }

        function animate(now) {
          const delta = Math.min(50, now - previousTime);
          previousTime = now;
          render(delta);
          frameId = requestAnimationFrame(animate);
        }

        function updateMotion() {
          cancelAnimationFrame(frameId);
          if (reduceMotion.matches) drawStill();
          else {
            previousTime = performance.now();
            frameId = requestAnimationFrame(animate);
          }
        }

        const prevent = event => event.preventDefault();
        addEventListener('resize', resize);
        reduceMotion.addEventListener('change', updateMotion);
        document.addEventListener('gesturestart', prevent, { passive: false });
        document.addEventListener('gesturechange', prevent, { passive: false });
        document.addEventListener('gestureend', prevent, { passive: false });
        document.addEventListener('touchmove', event => { if (event.touches.length > 1) prevent(event); }, { passive: false });
        document.addEventListener('wheel', event => { if (event.ctrlKey || event.metaKey) prevent(event); }, { passive: false });
        document.addEventListener('dblclick', prevent, { passive: false });
        document.addEventListener('keydown', event => {
          if ((event.ctrlKey || event.metaKey) && ['+', '-', '=', '0'].includes(event.key)) prevent(event);
        });

        resize();
        updateMotion();
      })();
    </script>
  </body>
</html>
